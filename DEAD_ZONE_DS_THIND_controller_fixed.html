function readGamepad(){
  const pads=getGamepadList();
  let gp=pads.find(p=>p&&p.index===gamepadIndex&&p.connected)||pads.find(p=>p&&p.connected);
  if(!gp){gamepadShoot=false;gamepadConnected=false;return null}
  gamepadConnected=true;gamepadIndex=gp.index;
  const ax=i=>gp.axes&&Number.isFinite(gp.axes[i])?gp.axes[i]:0;
  const dz=v=>Math.abs(v)<.18?0:(Math.abs(v)-.18)/.82*Math.sign(v);
  const buttons=gp.buttons||[];
  const pressed=i=>!!(buttons[i]&&(buttons[i].pressed||Number(buttons[i].value)>.5));
  let lx=dz(ax(0)),ly=dz(ax(1)),rx=dz(ax(2)),ry=dz(ax(3));

  const shoot=pressed(7)||pressed(6)||pressed(5)||pressed(4)||pressed(0)||pressed(1)||pressed(2)||rightStick;
  const pauseDown=pressed(9)||pressed(8);
  if(pauseDown&&!gamepadPauseWasDown)pause();

  gamepadShoot=shoot;
  if(st==='play'&&!gamepadRumblePrimed&&(shoot||rightStick||Math.hypot(lx,ly)>.35)){gamepadRumblePrimed=true;controllerRumble(5)}

}

function controllerRumble(damage=10){
  // Try all connected pads/actuators. Some browsers expose vibrationActuator,
  // others expose hapticActuators; some reject dual-rumble but support pulse().
  let pads=[];
  try{pads=getGamepadList()}catch(e){return}
  const candidates=[];
  const preferred=(gamepadIndex!==null)?pads[gamepadIndex]:null;
  if(preferred&&preferred.connected)candidates.push(preferred);
  for(const p of pads)if(p&&p.connected&&p!==preferred)candidates.push(p);
  if(!candidates.length)return;

  const strong=Math.max(.45,Math.min(1,.45+damage/35));
  const weak=Math.max(.3,Math.min(.9,strong*.75));
  const duration=Math.max(110,Math.min(320,100+damage*5));
  const params={startDelay:0,duration,strongMagnitude:strong,weakMagnitude:weak};
  const pulsed=new Set();
  const pulseFallback=(actuator)=>{
    if(!actuator||typeof actuator.pulse!=='function'||pulsed.has(actuator))return false;
    pulsed.add(actuator);
    try{
      const r=actuator.pulse(Math.max(strong,weak),duration);
      if(r&&typeof r.catch==='function')r.catch(()=>{});
      return true;
    }catch(e){return false}
  };
  const tryActuator=(actuator)=>{
    if(!actuator)return false;
    if(typeof actuator.playEffect==='function'){
      try{
        const result=actuator.playEffect('dual-rumble',params);
        if(result&&typeof result.then==='function'){
          result.then(status=>{if(status!=='complete'&&status!=='preempted')pulseFallback(actuator)})
                .catch(()=>{pulseFallback(actuator)});
        }
        return true;
      }catch(e){/* Fall through to legacy pulse(). */}
    }
    return pulseFallback(actuator);
  };
  for(const gp of candidates){
    // Prefer dual-motor rumble when available; use every exposed actuator as fallback.
    const acts=[];
    try{if(gp.vibrationActuator)acts.push(gp.vibrationActuator)}catch(e){}
    try{for(const a of (gp.hapticActuators||[]))if(a&&!acts.includes(a))acts.push(a)}catch(e){}
    for(const a of acts){if(tryActuator(a))return}
  }
}

function coatingMultiplier(z,c){

  if(!candidates.length)return;

  const strong=Math.max(.45,Math.min(1,.45+damage/35));
  const weak=Math.max(.3,Math.min(.9,strong*.75));
  const duration=Math.max(110,Math.min(320,100+damage*5));
  const params={startDelay:0,duration,strongMagnitude:strong,weakMagnitude:weak};
  const pulsed=new Set();
  const pulseFallback=(actuator)=>{
    if(!actuator||typeof actuator.pulse!=='function'||pulsed.has(actuator))return false;
    pulsed.add(actuator);
    try{
      const r=actuator.pulse(Math.max(strong,weak),duration);
      if(r&&typeof r.catch==='function')r.catch(()=>{});
      return true;
    }catch(e){return false}
  };
  const tryActuator=(actuator)=>{
    if(!actuator)return false;
    if(typeof actuator.playEffect==='function'){
      try{
        const result=actuator.playEffect('dual-rumble',params);
        if(result&&typeof result.then==='function'){
          result.then(status=>{if(status!=='complete'&&status!=='preempted')pulseFallback(actuator)})
                .catch(()=>{pulseFallback(actuator)});
        }
        return true;
      }catch(e){/* Fall through to legacy pulse(). */}
    }
    return pulseFallback(actuator);
  };
  for(const gp of candidates){
    // Prefer dual-motor rumble when available; use every exposed actuator as fallback.
    const acts=[];
    try{if(gp.vibrationActuator)acts.push(gp.vibrationActuator)}catch(e){}
    try{for(const a of (gp.hapticActuators||[]))if(a&&!acts.includes(a))acts.push(a)}catch(e){}
    for(const a of acts){if(tryActuator(a))return}
  }
}

    if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();master=ac.createGain();master.gain.value=0;
    const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
    const dl=ac.createDelay(1.5),fb=ac.createGain(),lp=ac.createBiquadFilter();
    dl.delayTime.value=.46;fb.gain.value=.42;lp.type='lowpass';lp.frequency.value=1500;
    dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);wet=dl;
    [[55,'sawtooth',.045],[55.35,'sawtooth',.045],[82.4,'triangle',.05],[110.3,'sine',.03]].forEach(([f,ty,g],i)=>{
      const o=ac.createOscillator(),gn=ac.createGain(),fl=ac.createBiquadFilter(),lf=ac.createOscillator(),lg=ac.createGain();
      o.type=ty;o.frequency.value=f;gn.gain.value=g;fl.type='lowpass';fl.frequency.value=240;lf.frequency.value=.05+i*.037;lg.gain.value=110;
      lf.connect(lg);lg.connect(fl.frequency);o.connect(fl);fl.connect(gn);gn.connect(master);o.start();lf.start();
    });
    nextT=ac.currentTime+.2;setInterval(sched,120);
  }
  function apply(){if(!ac)return;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(lvl()*.55,ac.currentTime,.9)}
  document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(lvl())ac.resume()});
  return{
    start(){init();if(!ac)return;ac.resume();want=1;apply()},
    set(v){want=v;if(!ac)return;if(v){ac.resume()}else setTimeout(()=>{if(!want&&ac)ac.suspend()},2600);apply()},
    mute(m){muted=m;try{localStorage.setItem('dsdz_mute',m?'1':'0')}catch(e){}if(ac&&!m&&want)ac.resume();apply()},
    isMuted:()=>muted,running:()=>!!ac&&ac.state==='running',
    blip(){if(ac&&!muted&&ac.state==='running')tone(660,ac.currentTime,.09,'square',.035)}
  };
})();

/* ---------- animated background ---------- */
const cv=$('bg'),cx=cv.getContext('2d');
let W,H,bgOn=false,parts=[],zs=[],fogs=[],bld=[];
function rs(){
  const d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  bld=[];let x=-20;while(x<W+40){const w=40+Math.random()*70;bld.push({x,w,h:H*(.12+Math.random()*.2),win:Math.random()});x+=w-6}
  parts=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,v:12+Math.random()*30,r:.6+Math.random()*1.8,p:Math.random()*6}));
  fogs=Array.from({length:5},()=>({x:Math.random()*W,y:H*(.45+Math.random()*.4),r:W*(.35+Math.random()*.3),v:6+Math.random()*10}));
  zs=Array.from({length:4},()=>({x:Math.random()*W,s:.9+Math.random()*.9,v:8+Math.random()*10,p:Math.random()*6}));
}
addEventListener('resize',rs);rs();
function zom(x,y,s,ph){
  const sw=Math.sin(ph)*3;cx.save();cx.translate(x,y);cx.scale(s,s);cx.fillStyle=cx.strokeStyle='#040605';
  cx.beginPath();cx.ellipse(0,-58,9,10,0,0,7);cx.fill();cx.fillRect(-9,-48,18,30);
  cx.fillRect(-8,-18,7,18+sw*.5);cx.fillRect(1,-18,7,18-sw*.5);
  cx.lineWidth=6;cx.lineCap='round';cx.beginPath();cx.moveTo(5,-44);cx.lineTo(30,-46+sw);cx.moveTo(5,-38);cx.lineTo(28,-37-sw);cx.stroke();
  cx.fillStyle='rgba(255,50,40,.9)';cx.fillRect(2,-60,2.5,2.5);cx.restore();
}
let last=0;
function draw(ts){
  requestAnimationFrame(draw);if(!bgOn)return;
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05080a');g.addColorStop(.6,'#0d1410');g.addColorStop(1,'#1a0c0b');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const mg=cx.createRadialGradient(W*.78,H*.18,0,W*.78,H*.18,H*.22);mg.addColorStop(0,'rgba(220,235,225,.35)');mg.addColorStop(.2,'rgba(160,190,175,.12)');mg.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=mg;cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(235,245,238,.8)';cx.beginPath();cx.arc(W*.78,H*.18,Math.max(12,H*.028),0,7);cx.fill();
  for(const b of bld){cx.fillStyle='#070a08';cx.fillRect(b.x,H-b.h,b.w,b.h);if(b.win>.7&&Math.sin(ts/400+b.x)>.2){cx.fillStyle='rgba(255,190,90,.35)';cx.fillRect(b.x+b.w*.3,H-b.h+14,5,7)}}
  for(const f of fogs){f.x+=f.v*dt;if(f.x-f.r>W)f.x=-f.r;const fg=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);fg.addColorStop(0,'rgba(120,150,125,.10)');fg.addColorStop(1,'rgba(120,150,125,0)');cx.fillStyle=fg;cx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2)}
  cx.fillStyle='#050706';cx.fillRect(0,H*.9,W,H*.1);
  for(const z of zs){z.x+=z.v*dt;if(z.x>W+60)z.x=-60;z.p+=dt*2.2;zom(z.x,H*.9+4,z.s*Math.min(1.4,H/520),z.p)}
  for(const p of parts){p.y-=p.v*dt;p.x+=Math.sin(ts/900+p.p)*10*dt;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}cx.fillStyle='rgba(255,'+((90+p.r*30)|0)+',50,'+(.25+p.r/4)+')';cx.fillRect(p.x,p.y,p.r,p.r)}
  const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.75)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);
}
requestAnimationFrame(draw);

/* ---------- screens ---------- */
let screen='splash',frame=null;
function show(id){screen=id;for(const s of document.querySelectorAll('.scr'))s.classList.toggle('on',s.id===id);bgOn=id!=='splash'&&!frame}
const sp=$('splash');let s1;
function go(){if(!sp.classList.contains('wait'))return;sp.classList.remove('wait');Music.start();s1=setTimeout(()=>{if(screen==='splash')show('title')},4600)}
sp.classList.add('wait');Music.start();setTimeout(()=>{if(Music.running())go()},300);
sp.onclick=()=>{if(sp.classList.contains('wait'))return go();clearTimeout(s1);if(screen==='splash')show('title')};
addEventListener('keydown',()=>{if(screen==='splash')go()});
function enter(){if(screen!=='title')return;Music.start();Music.blip();show('modes')}
$('title').onclick=enter;
addEventListener('keydown',e=>{if(screen==='title'&&e.key!=='F5')enter()});

$('bMute').classList.toggle('off',Music.isMuted());
$('bMute').onclick=()=>{Music.mute(!Music.isMuted());$('bMute').classList.toggle('off',Music.isMuted())};
if(!document.documentElement.requestFullscreen)$('bFs').style.display='none';
$('bFs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};

/* ---------- launching the two games ---------- */
const GAMES={};
for(const k of['sp','coop'])GAMES[k]=$('g-'+k).textContent.replace(/<\\\/script/gi,'</script');
function launch(k){
  Music.blip();$('fade').classList.add('on');
  setTimeout(()=>{
    frame=document.createElement('iframe');frame.id='game';frame.tabIndex=0;frame.setAttribute('allow','fullscreen; autoplay; gamepad');
    frame.onload=()=>{try{frame.focus();frame.contentWindow.focus()}catch(e){}$('fade').classList.remove('on')};
    frame.srcdoc=GAMES[k];$('stage').appendChild(frame);bgOn=false;
    $('back').classList.add('on');Music.set(1);
  },450);
}
function home(){
  if(!frame)return;
  try{frame.contentWindow.eval("typeof disconnectMP==='function'&&disconnectMP()")}catch(e){}
  frame.remove();frame=null;$('back').classList.remove('on');show('modes');Music.set(1);
}
$('bSP').onclick=()=>launch('sp');
$('bMP').onclick=()=>launch('coop');
$('back').onclick=home;
// the games report their state (menu / play / pause / over): music only plays on menus, the back button only when not playing
addEventListener('message',e=>{
  const d=e.data;if(!frame||e.source!==frame.contentWindow||!d||d.dz!=='st')return;
  $('back').classList.toggle('on',d.st!=='play');Music.set(d.st==='menu'?1:0);
});
</script>
